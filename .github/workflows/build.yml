        # Create zip file for easy download
        zip -r soft-paper-v1.0.8-release.zip release-package/
        
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          soft-paper-v1.0.8-release.zip
          release-package/soft-paper-v1.0.8.apk
          release-package/RELEASE_NOTES.md
          release-package/BUILD_INFO.md
        draft: false
        prerelease: false
        generate_release_notes: true
        
    - name: Upload to repository
      uses: actions/upload-artifact@v3
      with:
        name: soft-paper-release-package
        path: release-package/

  notify:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [test, build, release]
    if: success()
    
    steps:
    - name: Send success notification
      run: |
        echo "Soft Paper App v1.0.8 build and release completed successfully!"
        echo "APK files available in the release assets"
        echo "Ready for production!"
        
